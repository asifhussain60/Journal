<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asif's Journal</title>

    <!-- Google Fonts — Lato + Inter are the primary families; the remainder back
         the theme tokens (--font-serif / --font-script) the 9 themes reference. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;1,400&family=Great+Vibes&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/opendyslexic" rel="stylesheet" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4D6;</text></svg>"
    />

    <!-- Runtime-swappable theme stylesheet. The default href below is replaced
         pre-hydration by the boot script (from localStorage) to avoid a flash,
         and thereafter by useThemeStore. Themes live in /themes/ (static). -->
    <link rel="stylesheet" id="theme-stylesheet" href="/themes/theme-tales-dark.css" />

    <script>
      // Pre-hydration theme boot: apply the saved theme before React mounts so
      // there is no flash of the default theme. Mirrors the id/file registry in
      // src/stores/useThemeStore.ts (keep the fallback file in sync).
      (function () {
        try {
          var raw = localStorage.getItem("journal:theme");
          if (raw) {
            var file = JSON.parse(raw)?.state?.file;
            if (file) {
              document.getElementById("theme-stylesheet").href = "/themes/" + file;
            }
          }
        } catch (e) {
          /* first visit / private mode — keep default */
        }
      })();
    </script>
  </head>
  <body>
    <div class="bg-mesh"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
